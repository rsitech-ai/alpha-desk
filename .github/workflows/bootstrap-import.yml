name: Bootstrap Alpha Desk Git History

on:
  push:
    branches: [agent/import-current-implementation]
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify complete Git bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/alpha-desk.bundle.part.* > /tmp/alpha-desk.bundle.b64
          echo '23ceb77823d7d56abc96d4159ef835c4cda891678737d8598e5fcdc0ac74ba19  /tmp/alpha-desk.bundle.b64' | sha256sum --check
          base64 --decode /tmp/alpha-desk.bundle.b64 > /tmp/alpha-desk.bundle
          echo 'cc77a19323492fcdec7743bd7240b7013d3df4ed206d086a1e3d680090ff924e  /tmp/alpha-desk.bundle' | sha256sum --check
          git bundle verify /tmp/alpha-desk.bundle

      - name: Import exact local branch history
        shell: bash
        run: |
          set -euo pipefail
          git fetch /tmp/alpha-desk.bundle \
            refs/heads/feat/hyperliquid-alpha-desk-v1:refs/remotes/import/source
          test "$(git rev-parse refs/remotes/import/source)" = '5386fc3190d862375ed1ccbac0c19bcff90f19f5'
          git push \
            --force-with-lease=refs/heads/agent/import-current-implementation:${GITHUB_SHA} \
            origin \
            refs/remotes/import/source:refs/heads/agent/import-current-implementation
