[package]
name = "hl-capture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Source capture and truth-layer service boundary for Hyperliquid Alpha Desk."
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
canonical-events = { path = "../../crates/canonical-events", version = "=0.1.0" }
crc32c.workspace = true
domain-types = { path = "../../crates/domain-types", version = "=0.1.0" }
hl-protocol = { path = "../../crates/hl-protocol", version = "=0.1.0" }
canonical-archive = { path = "../../crates/canonical-archive", version = "=0.1.0" }
hex.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
storage-ports = { path = "../../crates/storage-ports", version = "=0.1.0" }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-postgres.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
