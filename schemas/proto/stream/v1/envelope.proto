syntax = "proto3";

package hl.stream.v1;

import "canonical/v1/events.proto";

message CanonicalEventRecord {
  string stream_name = 1;
  uint64 stream_sequence = 2;
  hl.canonical.v1.CanonicalEventEnvelope event = 3;
  int64 published_at_micros = 4;
  bytes previous_record_hash = 5;
}

message CanonicalEventBatch {
  repeated CanonicalEventRecord records = 1;
  bytes next_cursor = 2;
  bool end_of_committed_block = 3;
}
