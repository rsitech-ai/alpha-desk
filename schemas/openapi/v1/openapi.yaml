openapi: 3.1.0
info:
  title: Hyperliquid Alpha Desk API
  version: "0.1.0"
  description: >
    Read-only local REST surface generated from hl.health.v1,
    hl.capture.status.v4, hl.capture.status.v5, and the fail-closed HTTP router.
    Query row, timeout, and concurrency budgets are loaded from
    api-query-budgets.toml and reject oversized queries with typed 400/429.
    hl.stream.v1 defines CanonicalEventBatch with next_cursor but does not
    specify a WebSocket resume protocol, so stream paths return typed 501.
    This document is not a production authentication, availability, or SLO
    contract.
servers:
  - url: http://127.0.0.1:8788
    description: Loopback development listener
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Process liveness as hl.health.v1
      security: []
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessment"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness aggregate as hl.health.v1
      responses:
        "200":
          description: Configured snapshots are present and valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/health:
    get:
      operationId: getCanonicalHealth
      summary: Canonical health snapshot
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Validated hl.health.v1 snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessment"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QueryBudgetExceeded"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/capture/status:
    get:
      operationId: getCaptureStatus
      summary: Capture status snapshot
      description: >
        Fail-closed read of the configured capture snapshot. Inactive
        snapshots are hl.capture.status.v4 and omit maintenance.
        Maintenance snapshots are hl.capture.status.v5 and require a typed
        maintenance object. Missing files return 503 snapshot_missing;
        fail-closed validation failures return 503 snapshot_invalid,
        including v4 documents that smuggle maintenance and v5 documents
        that omit it. The body is the snapshot as read. Optional
        throughput_records_per_sec and throughput_blocks_per_sec are
        last-heartbeat integers, not live-qualified. This surface does
        not invent fills and does not mark sources live or qualified.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: >
            Validated inactive hl.capture.status.v4 or maintenance
            hl.capture.status.v5 snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureStatus"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QueryBudgetExceeded"
        "503":
          description: >
            Capture snapshot missing (reason_code snapshot_missing) or
            fail-closed invalid (reason_code snapshot_invalid). No invented
            fills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/stream:
    get:
      operationId: getStream
      summary: Reserved stream path
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QueryBudgetExceeded"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/stream/canonical-events:
    get:
      operationId: getCanonicalEventStream
      summary: Reserved canonical event stream path
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QueryBudgetExceeded"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/openapi.yaml:
    get:
      operationId: getOpenapi
      summary: OpenAPI document for this surface
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QueryBudgetExceeded"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Required when auth.mode = credential. loopback-dev binds loopback and
        skips the bearer. This is not production OIDC or mTLS.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: >
        Requested row count. Values above the configured max_rows budget
        fail closed with 400 query_budget_exceeded. Offset pagination is
        rejected. This is not a production SLO.
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthAssessment:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - scope
        - state
        - reason_code
        - observed_at_micros
        - suppresses
      properties:
        schema_version:
          type: string
          const: hl.health.v1
        scope:
          type: string
        state:
          type: string
          enum:
            - HEALTH_STATE_GREEN
            - HEALTH_STATE_AMBER
            - HEALTH_STATE_RED
        reason_code:
          type: string
        observed_at_micros:
          type: integer
          minimum: 0
        suppresses:
          type: array
          items:
            type: string
    CaptureStatus:
      description: >
        Fail-closed capture operator snapshot. Inactive documents use
        hl.capture.status.v4 and omit maintenance. Maintenance documents use
        hl.capture.status.v5 and require CaptureMaintenance. Extra snapshot
        fields such as auxiliary_sources are passed through when present.
        Optional throughput_records_per_sec and throughput_blocks_per_sec are
        last-heartbeat integers, not live-qualified. This is not a fills feed
        and does not mark sources live or qualified.
      oneOf:
        - $ref: "#/components/schemas/CaptureStatusV4"
        - $ref: "#/components/schemas/CaptureStatusV5"
    CaptureStatusBase:
      type: object
      required:
        - schema_version
        - snapshot_at_micros
        - build_id
        - chain_id
        - health
        - ready
        - active_committed_source
        - primary_source_health
        - pending_blocks
      properties:
        schema_version:
          type: string
        snapshot_at_micros:
          type: integer
          minimum: 0
        build_id:
          type: string
        chain_id:
          type: string
        health:
          type: string
          enum:
            - green
            - yellow
            - red
        ready:
          type: boolean
        active_committed_source:
          type: string
        primary_source_health:
          type: string
        pending_blocks:
          type: integer
          minimum: 0
        throughput_records_per_sec:
          type: integer
          minimum: 0
          description: >
            Last-heartbeat archive-acknowledged auxiliary record rate for the
            completed status-heartbeat window. Optional integer; not live-qualified.
        throughput_blocks_per_sec:
          type: integer
          minimum: 0
          description: >
            Last-heartbeat captured committed-block rate for the completed
            status-heartbeat window. Optional integer; not live-qualified.
    CaptureStatusV4:
      description: >
        Inactive capture status. maintenance is omitted; documents that
        smuggle it are snapshot_invalid.
      allOf:
        - $ref: "#/components/schemas/CaptureStatusBase"
        - type: object
          properties:
            schema_version:
              type: string
              const: hl.capture.status.v4
          not:
            required:
              - maintenance
    CaptureStatusV5:
      description: >
        Capture status with required maintenance visibility. Omitting
        maintenance is snapshot_invalid.
      allOf:
        - $ref: "#/components/schemas/CaptureStatusBase"
        - type: object
          required:
            - maintenance
          properties:
            schema_version:
              type: string
              const: hl.capture.status.v5
            maintenance:
              $ref: "#/components/schemas/CaptureMaintenance"
    CaptureMaintenance:
      type: object
      additionalProperties: false
      required:
        - enabled
        - kill_switch
        - health
        - pending_pack_manifest_count
        - packed_range_count
        - logical_manifest_count
        - physical_data_object_count
        - retention_authorized
      properties:
        enabled:
          type: boolean
        kill_switch:
          type: boolean
        health:
          type: string
          enum:
            - green
            - yellow
            - red
        reason_code:
          type: string
          description: Omitted when health is green; required when yellow or red.
        pending_pack_manifest_count:
          type: integer
          minimum: 0
        packed_range_count:
          type: integer
          minimum: 0
        logical_manifest_count:
          type: integer
          minimum: 0
        physical_data_object_count:
          type: integer
          minimum: 0
        last_scrub_at_micros:
          type: integer
          minimum: 0
        last_pack_index_at_micros:
          type: integer
          minimum: 0
        last_pack_data_at_micros:
          type: integer
          minimum: 0
        last_retention_at_micros:
          type: integer
          minimum: 0
        retention_authorized:
          type: boolean
          description: >
            Whether a verified backup-receipt artifact currently authorizes
            packed-object retention. A configured token is not enough.
    ApiError:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - code
        - reason_code
      properties:
        schema_version:
          type: string
          const: hl.api.error.v1
        code:
          type: string
        reason_code:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unavailable:
      description: Snapshot missing or invalid; no invented fills
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotImplemented:
      description: Stream transport is unspecified by proto and fail-closes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidQuery:
      description: Query string is invalid or uses forbidden offset pagination
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    QueryBudgetExceeded:
      description: >
        Requested rows exceed max_rows (400) or timeout/concurrency budget
        is exhausted (429). Fail-closed; this is not a production SLO.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
