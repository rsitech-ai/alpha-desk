schema_version = 1
max_file_bytes = 1048576

public = [
  ".cargo",
  ".gitattributes",
  ".gitignore",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "Cargo.lock",
  "Cargo.toml",
  "GOVERNANCE.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "SUPPORT.md",
  "apps",
  "crates",
  "deny.toml",
  "docs",
  "fixtures",
  "fuzz",
  "justfile",
  "rust-toolchain.toml",
  "schemas",
  "services",
  "tools",
]

# These roots can contain public material, but every release export requires
# an explicit human review because they can also carry identity, deployment,
# workflow, or operational configuration.
generated_review_required = [
  ".github",
  ".rsitech",
  "config",
  "infra",
]

private = []
excluded = ["artifacts"]

forbidden_path_prefixes = [
  ".superpowers/",
  "bootstrap/source.part.",
  "target/stage-gates/inputs/",
]

allowed_binary_paths = [
  "fixtures/archive/valid-v1/chain=mainnet/dataset=canonical_events/date=2024-07-24/hour=00/objects/block_start=700/block_end=700/part-1325c84bed0ecf04c3d1ad7949f4bfb9d41b6eeb617d154ccabfcf249b44e688.parquet",
  "fixtures/archive/valid-v1/chain=mainnet/dataset=canonical_events/date=2024-07-24/hour=00/objects/block_start=700/block_end=702/part-b1b794d50b08c869f05520d0c9142b48731eaeb257842f90d25ede11b95c1231.parquet",
  "fixtures/archive/valid-v1/chain=mainnet/dataset=canonical_events/date=2024-07-24/hour=00/objects/block_start=701/block_end=701/part-7ca0ff137f90fcff4c096c6c638b71fc8ef5ad5275cdb62096e2d94c49505ae6.parquet",
  "fixtures/archive/valid-v1/chain=mainnet/dataset=canonical_events/date=2024-07-24/hour=00/objects/block_start=702/block_end=702/part-c97309bcb804c2ccfd8961047960723d2645ce08e9394be91b2ea90c04bb5b63.parquet",
  "fixtures/archive/valid-v1/chain=mainnet/dataset=raw_source_observations/source=primary-node/date=2024-07-24/hour=00/objects/epoch=node-session-fixture/offsets=700-702/part-2050ff7301773273ca4c3cbdfacdf650c1ad4b255baca3f686119095d6bb9efd.parquet",
  "fixtures/spool/valid-v1/segment-0000000001.hlsp",
  "schemas/proto/baseline/v1.pb",
]

# The audit implementation and its canary tests must contain detector strings.
# Each exception is exact by rule and path; directory-wide exceptions are not
# permitted.
[[content_allowlist]]
rule = "private.absolute_user_path"
path = "tools/open-source-audit/src/lib.rs"

[[content_allowlist]]
rule = "private.alpha_threshold"
path = "tools/open-source-audit/src/lib.rs"

[[content_allowlist]]
rule = "secret.github_pat"
path = "tools/open-source-audit/src/lib.rs"

[[content_allowlist]]
rule = "secret.inline_api_key"
path = "tools/open-source-audit/src/lib.rs"

[[content_allowlist]]
rule = "secret.private_key"
path = "tools/open-source-audit/src/lib.rs"

[[content_allowlist]]
rule = "execution.package"
path = "tools/open-source-audit/src/lib.rs"

[[content_allowlist]]
rule = "private.absolute_user_path"
path = "tools/open-source-audit/tests/policy.rs"

[[content_allowlist]]
rule = "private.alpha_threshold"
path = "tools/open-source-audit/tests/policy.rs"

[[content_allowlist]]
rule = "secret.github_pat"
path = "tools/open-source-audit/tests/policy.rs"

[[content_allowlist]]
rule = "private.alpha_threshold"
path = "tools/open-source-audit/tests/cli.rs"

[[content_allowlist]]
rule = "private.absolute_user_path"
path = "tools/build-info/tests/cli.rs"
