schema_version = 1
stage_id = "stage-0-foundations"
schema_path = "config/stage-gates/schema-v1.json"
output_root = "target/stage-gates"
builder_report_output_path = "target/stage-gates/stage-0.builder.json"
whole_gate_timeout_seconds = 7200
max_output_bytes = 1048576
allowed_programs = [
  "just",
  "cargo",
  "rustc",
  "swift",
  "docker",
  "gpgv",
  "/usr/bin/uname",
  "./tools/ci/stage-0-compose-smoke.sh",
  "./infra/ansible/tests/check.sh",
]
program_roots = [
  "$CARGO_HOME/bin",
  "$HOME/.cargo/bin",
  "/opt/homebrew/bin",
  "/usr/local/bin",
  "/usr/bin",
  "/bin",
]

[design]
tag = "design-approved-v1.0.0"
object = "32e520a68e6596027fa0dc9673ddb70706474fef"
commit = "412c380054d16f22549c46a59a5fe0617bc60138"

[comparison]
second_builder_report_path = "target/stage-gates/inputs/stage-0.builder-b.json"
second_builder_signature_path = "target/stage-gates/inputs/stage-0.builder-b.json.asc"
signer_role = "builder-b"

[builder]
target_tool = "rustc"

[[builder.tools]]
id = "rustc"
program = "rustc"
args = ["+1.97.1", "-vV"]
expected_output_contains = "rustc 1.97.1"

[[builder.tools]]
id = "cargo"
program = "cargo"
args = ["+1.97.1", "--version", "--verbose"]
expected_output_contains = "cargo 1.97.1"

[[builder.tools]]
id = "swift"
program = "swift"
args = ["--version"]
expected_output_contains = "Swift version 6.3"

[[builder.tools]]
id = "just"
program = "just"
args = ["--version"]

[[builder.tools]]
id = "docker"
program = "docker"
args = ["--version"]

[[builder.tools]]
id = "os"
program = "/usr/bin/uname"
args = ["-s", "-r", "-m"]

[approvals]
policy_path = "config/stage-gates/stage-0-trust-policy.toml"
required_roles = ["platform-data", "independent"]
gpgv_program = "gpgv"
known_limitations = [
  "Stage 0 validates foundations only; it does not authorize deployment or trading.",
  "Approval signatures, remote required-check proof, and the second-builder report are externally supplied evidence.",
  "The custom github-ci OpenPGP signature proves possession of a long-lived key, not GitHub or Sigstore workload identity; key custody, rotation, and revocation remain operator-controlled.",
  "Unix process-group cleanup cannot contain a hostile descendant that escapes into a new session with setsid; stronger OS-level containment is required for untrusted commands.",
]

[[approvals.evidence]]
role = "platform-data"
statement_path = "target/stage-gates/inputs/platform-data.statement.json"
signature_path = "target/stage-gates/inputs/platform-data.statement.json.asc"

[[approvals.evidence]]
role = "independent"
statement_path = "target/stage-gates/inputs/independent.statement.json"
signature_path = "target/stage-gates/inputs/independent.statement.json.asc"

[remote]
proof_path = "target/stage-gates/inputs/github-required-checks.json"
signature_path = "target/stage-gates/inputs/github-required-checks.json.asc"
signer_role = "github-ci"
repository = "s1korrrr/alpha-desk"
repository_id = 1311268858
repository_owner_id = 24563931
workflow = ".github/workflows/stage-0-evidence.yml"
workflow_ref = "s1korrrr/alpha-desk/.github/workflows/stage-0-evidence.yml@refs/heads/main"
# Migration blocker: replace 0 with the published CI workflow's immutable
# numeric GitHub Actions workflow ID before accepting remote proof.
trigger_workflow_id = 0
trigger_workflow_name = "CI"
trigger_workflow_path = ".github/workflows/ci.yml"
event_name = "push"
git_ref = "refs/heads/main"
signing_check_name = "Stage 0 evidence signing"
required_checks = [
  "Rust quality",
  "Rust tests",
  "Swift 6.3",
  "Static Compose policy",
  "Trusted integration smoke",
  "Reproducible service binaries",
]

[[artifacts]]
id = "cargo-lock"
path = "Cargo.lock"
kind = "dependency-lock"
producer = "repository"
target_triple = "platform-independent"
profile = "source"

[[artifacts]]
id = "cargo-config"
path = ".cargo/config.toml"
kind = "build-configuration"
producer = "repository"
target_triple = "platform-independent"
profile = "source"

[[artifacts]]
id = "schema-descriptor"
path = "schemas/proto/baseline/v1.pb"
kind = "protobuf-descriptor"
producer = "schema-generate"
target_triple = "platform-independent"
profile = "baseline"

[[artifacts]]
id = "fixture-manifest"
path = "fixtures/golden/manifest.toml"
kind = "fixture-manifest"
producer = "fixture-inspect"
target_triple = "platform-independent"
profile = "golden"

[[artifacts]]
