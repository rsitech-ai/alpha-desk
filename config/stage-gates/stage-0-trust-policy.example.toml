schema_version = 1
keyring_path = "target/stage-gates/inputs/stage-0-reviewers.gpg"

# Copy four real, distinct fingerprints into the committed
# stage-0-trust-policy.toml registry. The gate hashes the committed bytes.
[[reviewers]]
role = "platform-data"
fingerprint = "replace-with-full-platform-data-fingerprint"

[[reviewers]]
role = "independent"
fingerprint = "replace-with-full-independent-fingerprint"

[[reviewers]]
role = "builder-b"
fingerprint = "replace-with-full-builder-b-fingerprint"

[[reviewers]]
role = "github-ci"
fingerprint = "replace-with-full-github-ci-fingerprint"
