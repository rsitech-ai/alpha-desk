# Safe local example. This starts no network source by itself.
parser_version = "parser-v1"

[runtime]
chain_id = "mainnet"
first_height = 1
archive_path = "state/canonical-archive"
status_path = "state/capture-status.json"
failover_state_path = "state/committed-source-failover.json"
# Sensitive connection material is read from owner-only files at startup.
postgres_url_path = "/run/secrets/alpha-desk-postgres-url"
nats_server_url = "nats://127.0.0.1:4222"
nats_stream = "HL_CANONICAL"
nats_username = "capture"
nats_password_path = "/run/secrets/alpha-desk-nats-capture-password"
postgres_operation_timeout_millis = 5000
max_pending_blocks = 4096
retained_committed_blocks = 4096
publisher_ledger_capacity = 100000
nats_max_ack_inflight = 4096
publish_timeout_millis = 5000
backpressure_timeout_millis = 5000
shutdown_grace_millis = 15000
disk_reserve_bytes = 10737418240
# Default raw_archive_format is v2 (legacy contiguous + byte-offset V2).
# Set raw_archive_format = "v3" and a [runtime.raw_v3] capacity table to attach RawV3Archive.
# V3 also starts an owned packing/scrub/retention task; GC still fail-closes without a
# verified backup receipt artifact whose digest is configured as
# [runtime.raw_v3.maintenance] backup_receipt_sha256. A typed hex token is not enough.
# This is not 24-hour soak evidence.

[spool]
path = "state/capture-spool"
segment_target_bytes = 67108864
rotation_interval_seconds = 300

[spool.committed_durability]
mode = "fsync-every-record"

[spool.provisional_durability]
mode = "batched"
max_records = 128
max_delay_millis = 100

[[sources]]
id = "primary-node"
source_version = "hyperliquid-node-v1"
trust = "locally-verified-committed"
class = "committed-block"
queue_capacity = 4096
max_payload_bytes = 8388608
# Replace this illustrative start height with the first retained height approved for your node.
adapter = { kind = "node-block-directory", path = "/var/lib/hyperliquid/hl/data/replica_cmds", stream_name = "replica-cmds", start_height = 1, poll_interval_millis = 25, replica_cmds_style = "actions-and-responses" }

[[sources]]
id = "public-market"
source_version = "public-market-v1"
trust = "third-party-provisional"
class = "public-market-data"
queue_capacity = 1024
max_payload_bytes = 1048576
# Optional credentials are protected path references, never inline values.
credential_path = "/run/secrets/public-market-token"
