schema_version = 1

# Bootstrap inventory from spec Appendix B plus current node streams and S3 archives.
# REST/WS/S3/EVM adapters are not on this tree. Node replica_cmds / NodeLine rows
# are implemented_unqualified only when hl-protocol parsers and fixtures/source/node-v1 exist.
# All node_files rows (including market-metadata periodic state, spec §6.1) and
# s3.replica_cmds are committed. Remaining official S3 archives are historical
# backfill (spec §6.1 priority 4), mapped to evidence-only rather than enrichment.

[[capability]]
id = "official.info.all_mids"
source = "official"
network = ["mainnet", "testnet"]
transport = "rest_info"
identifier = "allMids"
domain = "market_data"
source_role = "reconciliation"
request_cost = "base:2"
pagination = "none"
parser = "planned"
fixture_set = "none"
retention = "raw_indefinite"
freshness_target_ms = 30000
owner = "hl-capture"
state_target = "reference_snapshot"
status = "planned"
limitations = "REST /info adapter is not on this tree"

