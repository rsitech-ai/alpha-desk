---
- name: Reject any non-scaffold inventory
  ansible.builtin.assert:
    that:
      - alpha_stage0_scaffold | default(false) | bool
      - alpha_inventory_kind | default('') in ['example', 'molecule']
      - >-
        alpha_v1_services | sort ==
        ['hl-analytics', 'hl-api', 'hl-capture', 'hl-core', 'hl-research']
    fail_msg: >-
      Stage 0 accepts only the explicit example or Molecule scaffold inventory.
    quiet: true

- name: Require non-routable names in the example inventory
  ansible.builtin.assert:
    that:
      - inventory_hostname is match('^[a-z0-9.-]+[.]invalid$')
    fail_msg: Every example inventory host must end in .invalid.
    quiet: true
  when: alpha_inventory_kind == 'example'

- name: Require the reviewed Ubuntu 24.04 package target
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == '24.04'
      - alpha_stage0_packages | length == 6
      - >-
        alpha_stage0_packages
        | select('match', '^[a-z0-9-]+=[^= ]+$')
        | list
        | length == 6
    fail_msg: >-
      Stage 0 package pins apply only to the reviewed Ubuntu 24.04 target.
    quiet: true

- name: Install the exact Stage 0 APT preference policy
  ansible.builtin.copy:
    content: |
      # Exact Ubuntu 24.04 package pins reviewed for the Stage 0 scaffold.
      # APT never downgrades at priority 1000; Stage 0 also rejects mismatches.
      {% for package_spec in alpha_stage0_packages %}
      Package: {{ package_spec.split('=')[0] }}
      Pin: version {{ package_spec.split('=')[1] }}
      Pin-Priority: 1000

      {% endfor %}
    dest: /etc/apt/preferences.d/alpha-desk-stage0
    owner: root
    group: root
    mode: "0644"

- name: Refresh Noble package metadata without upgrading packages
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Read installed packages before exact-version resolution
  ansible.builtin.package_facts:
    manager: apt

- name: Reject installed package replacement or downgrade
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.packages.get(item.split('=')[0], []) | length == 0 or
        ansible_facts.packages[item.split('=')[0]][0].version ==
        item.split('=')[1]
    fail_msg: >-
      Installed package {{ item.split('=')[0] }} does not match the reviewed
      Noble pin; Stage 0 refuses replacement or downgrade.
    quiet: true
  loop: "{{ alpha_stage0_packages }}"
  loop_control:
    label: "{{ item }}"

- name: Resolve each exact Noble package candidate
  ansible.builtin.command:
    cmd: "apt-cache policy {{ item.split('=')[0] }}"
  register: common_stage0_apt_candidates
  check_mode: false
  changed_when: false
  loop: "{{ alpha_stage0_packages }}"
  loop_control:
    label: "{{ item }}"

- name: Reject missing or silently substituted Noble package candidates
  ansible.builtin.assert:
    that:
      - >-
        ('Candidate: ' ~ item.item.split('=')[1]) in item.stdout
      - >-
        (item.item.split('=')[1] ~ ' 1000') in
        (item.stdout | regex_replace('[\\n ]+', ' '))
    fail_msg: >-
      APT did not resolve the exact priority-1000 Noble pin for
      {{ item.item }}; no fallback version is allowed.
    quiet: true
  loop: "{{ common_stage0_apt_candidates.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install the exact Noble host-preparation packages without activation
  ansible.builtin.apt:
    name: "{{ alpha_stage0_packages }}"
    state: present
    install_recommends: false
    policy_rc_d: 101
    allow_downgrade: false
    allow_change_held_packages: false
    force: false
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Read installed packages after exact-version resolution
  ansible.builtin.package_facts:
    manager: apt

- name: Verify exact Noble package versions were installed
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.packages[item.split('=')[0]][0].version ==
        item.split('=')[1]
    fail_msg: "Installed package does not match exact Noble pin: {{ item }}"
    quiet: true
  loop: "{{ alpha_stage0_packages }}"
  loop_control:
    label: "{{ item }}"

- name: Create the shared service group
  ansible.builtin.group:
    name: hl-services
    system: true
    state: present

- name: Create the inactive configuration root
  ansible.builtin.file:
    path: /etc/hyperliquid-alpha-desk
    state: directory
    owner: root
    group: hl-services
    mode: "0750"

- name: Record the UTC timezone label without changing the running clock
  ansible.builtin.copy:
    content: "Etc/UTC\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"

- name: Point local time configuration at UTC
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Etc/UTC
    dest: /etc/localtime
    owner: root
    group: root
    state: link
    force: true

- name: Declare trusted chrony sources without starting chrony
  ansible.builtin.copy:
    content: |
      # Managed Stage 0 scaffold. Runtime synchronization remains unproven.
      {% for source in alpha_chrony_sources %}
      server {{ source }} iburst
      {% endfor %}
    dest: /etc/chrony/sources.d/alpha-desk.sources
    owner: root
    group: root
    mode: "0644"

- name: Install the earliest inactive OpenSSH hardening drop-in
  ansible.builtin.copy:
    content: |
      # Validate key access in a disposable VM before any later reload.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowTcpForwarding no
    dest: /etc/ssh/sshd_config.d/00-alpha-desk-stage0.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the SSH runtime directory for syntax validation
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure inactive UFW input default for its actual consumer
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_INPUT_POLICY='
    line: 'DEFAULT_INPUT_POLICY="DROP"'
    owner: root
    group: root
    mode: "0644"

- name: Configure inactive UFW output default for its actual consumer
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_OUTPUT_POLICY='
    line: 'DEFAULT_OUTPUT_POLICY="ACCEPT"'
    owner: root
    group: root
    mode: "0644"

- name: Configure inactive UFW forward default for its actual consumer
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="DROP"'
    owner: root
    group: root
    mode: "0644"

- name: Install the Alpha Desk log rotation policy
  ansible.builtin.copy:
    content: |
      /var/log/hyperliquid-alpha-desk/*/*.log {
          daily
          rotate 14
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
      }
    dest: /etc/logrotate.d/hyperliquid-alpha-desk
    owner: root
    group: root
    mode: "0644"

- name: Install file descriptor limits for the exact V1 accounts
  ansible.builtin.copy:
    content: |
      # Runtime suitability remains a disposable-VM and load-test gate.
      @hl-services soft nofile 1048576
      @hl-services hard nofile 1048576
    dest: /etc/security/limits.d/90-alpha-desk.conf
    owner: root
    group: root
    mode: "0644"

- name: Create one system group per allowed V1 service
  ansible.builtin.group:
    name: "hl-{{ item }}"
    system: true
    state: present
  loop: "{{ alpha_v1_services }}"
  loop_control:
    label: "{{ item }}"

- name: Create one locked system account per allowed V1 service
  ansible.builtin.user:
    name: "hl-{{ item }}"
    group: "hl-{{ item }}"
    groups:
      - hl-services
    append: true
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    password_lock: true
    state: present
  loop: "{{ alpha_v1_services }}"
  loop_control:
    label: "{{ item }}"

- name: Create shared inactive configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: hl-services
    mode: "0750"
  loop:
    - /var/lib/hyperliquid-alpha-desk
    - /var/log/hyperliquid-alpha-desk

- name: Create private state and log directories for allowed services
  ansible.builtin.file:
    path: "{{ item.1 }}/{{ item.0 }}"
    state: directory
    owner: "hl-{{ item.0 }}"
    group: "hl-{{ item.0 }}"
    mode: "0750"
  loop: >-
    {{
      alpha_v1_services
      | product(
        [
          '/var/lib/hyperliquid-alpha-desk',
          '/var/log/hyperliquid-alpha-desk'
        ]
      )
      | list
    }}
  loop_control:
    label: "{{ item.1 }}/{{ item.0 }}"

- name: Record the staged security-update policy without package holds
  ansible.builtin.copy:
    content: |
      Stage 0 does not freeze security-critical packages.
      Resolve Noble updates in a disposable environment, record versions,
      then validate SSH, chrony, UFW, systemd, and reboot behavior in a VM.
    dest: /etc/hyperliquid-alpha-desk/security-updates.policy
    owner: root
    group: hl-services
    mode: "0640"
