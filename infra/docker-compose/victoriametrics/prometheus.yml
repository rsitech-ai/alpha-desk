global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: otel-collector-internal
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: alpha-desk-otlp-metrics
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: victoriametrics
    static_configs:
      - targets:
          - victoriametrics:8428
