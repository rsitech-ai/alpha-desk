server_name: alpha-desk-dev
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 128MB
  max_file_store: 4GB
}

max_payload: 8MB
write_deadline: "10s"
lame_duck_duration: "30s"
lame_duck_grace_period: "10s"

authorization {
  timeout: 2
  users: [
    {
      user: $NATS_BOOTSTRAP_USER
      password: $NATS_BOOTSTRAP_PASSWORD
      permissions: {
        publish: {
          allow: ["$JS.API.>"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
      }
    }
    {
      user: $NATS_CAPTURE_USER
      password: $NATS_CAPTURE_PASSWORD
      permissions: {
        publish: {
          allow: [
            "hl.v1.block.*",
            "hl.v1.event.*",
            "hl.v1.health.data"
          ]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
      }
    }
    {
      user: $NATS_READER_USER
      password: $NATS_READER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.*",
            "$JS.API.STREAM.MSG.GET.*",
            "$JS.API.CONSUMER.INFO.*.*",
            "$JS.API.CONSUMER.MSG.NEXT.*.*",
            "$JS.ACK.>"
          ]
        }
        subscribe: {
          allow: [
            "_INBOX.>",
            "hl.v1.>"
          ]
        }
      }
    }
  ]
}
