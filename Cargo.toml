[workspace]
resolver = "3"
members = [
  "crates/domain-types",
  "crates/hl-protocol",
  "crates/canonical-events",
  "crates/canonical-ledger",
  "crates/canonical-state-store",
  "crates/canonical-archive",
  "crates/orderbook",
  "crates/margin-models",
  "crates/entity-graph",
  "crates/feature-core",
  "crates/intelligence-replay",
  "crates/wallet-intelligence",
  "crates/market-intelligence",
  "crates/signal-core",
  "crates/execution-sim",
  "crates/replay-engine",
  "crates/model-runtime",
  "crates/storage-ports",
  "crates/api-contracts",
  "crates/telemetry",
  "crates/test-fixtures",
  "services/hl-capture",
  "services/hl-core",
  "services/hl-analytics",
  "services/hl-research",
  "services/hl-api",
  "tools/fixture-inspect",
  "tools/schema-check",
  "tools/spool-inspect",
  "tools/canonical-inspect",
  "tools/archive-inspect",
  "tools/book-inspect",
  "tools/build-info",
  "tools/architecture-check",
  "tools/stage-gate",
  "tools/open-source-audit",
  "tools/state-replay",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
homepage = "https://rsitech.ai"
repository = "https://github.com/rsitech-ai/alpha-desk"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
arrow = { version = "=58.4.0", default-features = false }
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "nkeys", "ring", "server_2_14"] }
async-trait = "0.1"
blake3 = "1.8"
bytes = "1.10"
cargo_metadata = "=0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
datafusion = { version = "=54.1.0", default-features = false, features = ["parquet"] }
crc32c = "=0.6.8"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
hex = "0.4"
http = "=1.4.2"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["http1", "server", "tokio"] }
jsonschema = { version = "=0.48.5", default-features = false }
num-bigint = "0.4"
num-traits = "0.2"
proptest = "1.7"
prost = "0.14"
prost-types = "0.14"
prometheus = "=0.14.0"
rustc_version = "=0.4.1"
getrandom = "=0.3.4"
rustix = { version = "=1.1.4", features = ["event", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.0"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost-build = "=0.14.6"
tracing = "0.1"
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
parquet = { version = "=58.4.0", default-features = false, features = ["arrow", "zstd"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
